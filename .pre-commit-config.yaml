repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix --force-exclude
        language: python
        additional_dependencies: ["ruff==0.16.3"]
        types_or: [python, pyi]

      - id: basedpyright
        name: basedpyright
        entry: basedpyright
        language: python
        additional_dependencies: ["basedpyright==1.39.10"]
        pass_filenames: false
        types_or: [python, pyi]

      - id: vulture
        name: vulture
        entry: vulture
        language: python
        additional_dependencies: ["vulture==2.16"]
        pass_filenames: false
        types_or: [python, pyi]
