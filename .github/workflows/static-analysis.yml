name: Static analysis

on:
  push:
  pull_request:

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: python -m pip install -r requirements-dev.txt

      - name: Run pre-commit
        run: pre-commit run --all-files
